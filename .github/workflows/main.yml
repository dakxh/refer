name: Execute API Registration Request

# This allows you to manually trigger the workflow from the Actions tab
on: 
  workflow_dispatch:

jobs:
  run-request:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create and execute Python script
        # We use a heredoc (cat << 'EOF') to write the python code to a file, then execute it.
        # The single quotes around 'EOF' prevent Bash from interpreting any special characters.
        run: |
          cat << 'EOF' > script.py
          import requests
          import random
          import string
          import json

          def generate_random_alpha_string(length=11):
              return ''.join(random.choices(string.ascii_letters, k=length))

          username = generate_random_alpha_string()
          password = generate_random_alpha_string()

          url = "https://teens25.vip/api/register"

          headers = {
              "Host": "teens25.vip",
              "Sec-Ch-Ua-Platform": '"Windows"',
              "Accept-Language": "en-US,en;q=0.9",
              "Sec-Ch-Ua": '"Not-A.Brand";v="24", "Chromium";v="146"',
              "Content-Type": "application/json",
              "Sec-Ch-Ua-Mobile": "?0",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36",
              "Accept": "*/*",
              "Origin": "https://teens25.vip",
              "Sec-Fetch-Site": "same-origin",
              "Sec-Fetch-Mode": "cors",
              "Sec-Fetch-Dest": "empty",
              "Referer": "https://teens25.vip/register?invite=07e11298",
              "Accept-Encoding": "gzip, deflate, br",
              "Priority": "u=1, i",
              "Connection": "keep-alive"
          }

          payload = {
              "username": username,
              "password": password,
              "repeatPassword": password,
              "referralCode": "07e11298"
          }

          print(f"[*] Generated Username: {username}")
          print(f"[*] Generated Password: {password}")
          print("[*] Sending POST request...")

          try:
              response = requests.post(url, headers=headers, json=payload)
              
              print("\n" + "="*50)
              print("RESPONSE STATUS CODE:")
              print("="*50)
              print(f"{response.status_code} {response.reason}")
              
              print("\n" + "="*50)
              print("RESPONSE HEADERS:")
              print("="*50)
              for key, value in response.headers.items():
                  print(f"{key}: {value}")
                  
              print("\n" + "="*50)
              print("RESPONSE BODY:")
              print("="*50)
              try:
                  parsed_json = response.json()
                  print(json.dumps(parsed_json, indent=4))
              except requests.exceptions.JSONDecodeError:
                  print(response.text)

          except requests.exceptions.RequestException as e:
              print(f"\n[!] An error occurred during the request: {e}")
          EOF

          # Run the script we just generated
          python script.py
